# SPDX-License-Identifier: GPL-3.0-or-later
name: ADFS Common V2 development qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

      - uses: actions/checkout@v4
        with:
          repository: simoninns/OpenAcornExplorer
          ref: 93c8904d9049e579d9c9ac468b8a36ed652b3775
          path: .acorn-oracle
          persist-credentials: false
      - name: Read genuine hardware-created Acorn images
        run: |
          set -e
          for item in 'E 800K' 'E+ 800K' 'F 1600K' 'F+ 1600K'; do
            image=".acorn-oracle/ADFS Test images/ADFS $item.adl"
            case "$item" in *+*) variant=2;; *) variant=1;; esac
            sha256sum "$image" > before.sha256
            od -An -tx1 -j 3520 -N 60 "$image"
            od -An -tx1 -j 4 -N 60 "$image"
            build/test_adfs build/carrier/ADFS.so "$image" "$variant"
            build/test_adfs build/firmware/ADFS.so "$image" "$variant"
            sha256sum -c before.sha256
          done
